<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>CWF Media Library</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Records" />
  <link rel="apple-touch-icon" href="https://play-lh.googleusercontent.com/L-NOoF7qLgO3m-pP-A7IF1X2AiCSyL2iF_AOv9rNqFjQWBznDtFXjDrtujXEJa9NfPaNOXLR7inEQ_QuFfZd-QQ=s192" />
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #0f1115; --card: #181b22; --accent: #1db954; --warn: #f59e0b;
      --text: #f3f4f6; --muted: #9ca3af; --border: #2a2f3a; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(12px);
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      width: 100%; max-width: 100vw;
    }
    .welcome-banner {
      font-size: 1.05rem; font-weight: 800; color: var(--accent); margin-bottom: 4px;
      letter-spacing: -0.01em; animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .install-banner {
      display: none; background: rgba(29, 185, 84, 0.14); border: 1px solid var(--accent);
      border-radius: 12px; padding: 8px 10px; margin-bottom: 10px;
      align-items: center; justify-content: space-between; gap: 8px; font-size: 0.8rem;
    }
    .install-banner.show { display: flex; }
    .install-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-install-now {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      padding: 5px 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer;
    }
    .btn-dismiss-install {
      background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 2px 4px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; width: 100%; }
    h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    
    .lang-icon-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; overflow: hidden;
      transition: transform 0.1s;
    }
    .lang-icon-btn:active { transform: scale(0.92); }
    .lang-icon-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

    .btn-small { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; border-radius: 8px; font-size: 0.72rem; cursor: pointer; height: 26px; display: flex; align-items: center; }
    .badge-count { background: var(--card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; color: var(--muted); white-space: nowrap; height: 26px; display: flex; align-items: center; }

    .search-controls { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; }
    .search-box {
      flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 0.88rem; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    .sort-select {
      width: 130px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0 6px; border-radius: 10px; font-size: 0.78rem; outline: none; cursor: pointer; height: 38px;
    }
    .sort-select:focus { border-color: var(--accent); }

    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; width: 100%; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; }
    .album-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
    .album-card:active { transform: scale(0.97); }
    .album-card:hover { border-color: var(--accent); }

    .cover-wrap { width: 100%; aspect-ratio: 1 / 1; background: #232732; display: flex; align-items: center; justify-content: center; position: relative; }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .no-cover { font-size: 2rem; color: #4b5563; }
    .format-tag { position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
    .info { padding: 8px 10px; }
    .title { font-size: 0.85rem; font-weight: 700; line-height: 1.2; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .artist { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; gap: 4px; }
    .year { font-size: 0.7rem; color: #6b7280; }
    .genre { font-size: 0.68rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fab {
      position: fixed; bottom: 20px; right: 16px; left: 16px; max-width: 400px; margin: 0 auto;
      background: var(--accent); color: #000; border: none; border-radius: 14px;
      padding: 13px 18px; font-size: 0.95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 20px rgba(29, 185, 84, 0.35); cursor: pointer; z-index: 30;
    }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); color: var(--text); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 18px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }

    .detail-cover { width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; background: #232732; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
    .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
    
    .edit-field-group { margin-bottom: 9px; }
    .edit-field-group label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 2px; }
    .edit-input, .edit-select { width: 100%; padding: 9px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 0.88rem; outline: none; }
    .edit-input:focus, .edit-select:focus { border-color: var(--accent); }

    .notes-textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 9px; padding: 9px; font-size: 0.88rem; resize: vertical; min-height: 50px; outline: none;
    }
    .notes-textarea:focus { border-color: var(--accent); }

    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); border-radius: 9px; padding: 11px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn-actions-group { display: flex; gap: 8px; margin-top: 12px; }

    .manual-row { display: flex; gap: 8px; margin-top: 8px; }
    .manual-row input, .manual-row select { flex: 1; padding: 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none; }
    .btn-primary { background: var(--accent); color: #000; border: none; border-radius: 9px; padding: 11px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--border); color: var(--text); border: none; border-radius: 9px; padding: 11px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; }
    
    .result-box { margin-top: 12px; padding: 12px; border-radius: 10px; display: none; color: var(--text); font-size: 0.88rem; }
    .result-box.duplicate { display: block; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warn); }
    .result-box.added { display: block; background: rgba(29, 185, 84, 0.15); border: 1px solid var(--accent); }
    .result-box.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
    .loader { text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1; }
    .form-group { margin-top: 10px; display: none; }
    .form-group.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="welcome-banner">Hey Chris! 👋🏾</div>

    <div id="installBanner" class="install-banner">
      <span id="installText"></span>
      <div class="install-actions">
        <button id="btnInstallAction" class="btn-install-now" style="display:none;" onclick="triggerNativeInstall()">Install</button>
        <button class="btn-dismiss-install" onclick="dismissInstallBanner()">✕</button>
      </div>
    </div>

    <div class="top-bar">
      <h1 id="appTitle">📀 My Library</h1>
      <div class="actions-group">
        <button class="lang-icon-btn" onclick="toggleLanguage()" title="Cambiar Idioma / Change Language">
          <img src="https://play-lh.googleusercontent.com/L-NOoF7qLgO3m-pP-A7IF1X2AiCSyL2iF_AOv9rNqFjQWBznDtFXjDrtujXEJa9NfPaNOXLR7inEQ_QuFfZd-QQ=s0-br30" alt="ES/EN" />
        </button>
        <button class="btn-small" id="configBtn" onclick="setupToken()">⚙️ Setup</button>
        <span class="badge-count" id="totalCount">Loading...</span>
      </div>
    </div>

    <div class="search-controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search artist, album, genre or barcode..." oninput="renderGrid()" />
      <select id="sortSelect" class="sort-select" onchange="renderGrid()">
        <option value="date-desc" id="optDateDesc">📅 Newest added</option>
        <option value="date-asc" id="optDateAsc">📅 Oldest added</option>
        <option value="artist-asc">👤 Artist (A-Z)</option>
        <option value="artist-desc">👤 Artist (Z-A)</option>
        <option value="title-asc">💿 Title (A-Z)</option>
        <option value="year-desc">📀 Year (Newest)</option>
        <option value="year-asc">📀 Year (Oldest)</option>
      </select>
    </div>

    <div class="filters">
      <div class="chip active" onclick="setFilter('ALL', this)" data-key="all">All</div>
      <div class="chip" onclick="setFilter('Vinyl (LP)', this)">Vinyl (LP)</div>
      <div class="chip" onclick="setFilter('SACD', this)">SACD</div>
      <div class="chip" onclick="setFilter('CD', this)">CD</div>
      <div class="chip" onclick="setFilter('Blu-ray', this)">Blu-ray</div>
      <div class="chip" onclick="setFilter('Box Set', this)">Box Set</div>
    </div>
  </header>

  <main id="gridContainer" class="grid">
    <div class="loader" id="loadingText">Loading library...</div>
  </main>

  <button class="fab" id="fabBtn" onclick="openScannerModal()">
    📷 Scan or Search UPC
  </button>

  <input type="file" id="barcodeInputFile" accept="image/*" capture="environment" style="display:none;" onchange="handleBarcodeInput(event)">
  <!-- Input oculto para subir foto de portada personalizada -->
  <input type="file" id="customCoverFile" accept="image/*" style="display:none;" onchange="handleCustomCoverInput(event)">

  <!-- Modal de Registro -->
  <div class="modal-backdrop" id="scannerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Record Registration</h3>
        <button class="close-btn" onclick="closeScanner()">✕</button>
      </div>

      <div id="scannerOptions">
        <button class="btn-primary" onclick="document.getElementById('barcodeInputFile').click()">📸 Take photo of barcode / Tomar foto</button>
        <button class="btn-secondary" onclick="showManualInputMode()">⌨️ Type barcode manually / Escribir código</button>
      </div>

      <div id="manualInputContainer" style="display:none; margin-top: 10px;">
        <div class="manual-row">
          <input type="tel" id="manualBarcode" placeholder="Enter barcode digits..." />
          <button class="btn-primary" id="btnManualSearch" style="width: auto; margin-top:0;" onclick="processBarcode(document.getElementById('manualBarcode').value)">Search</button>
        </div>
      </div>

      <div id="scanResult" class="result-box"></div>

      <div id="manualForm" class="form-group">
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 12px 0;">
        <p style="font-size: 0.82rem; color: var(--warn); margin-bottom: 8px;" id="warningText">⚠️ Not found in databases. Complete details:</p>
        <label id="lblArtist">Artist:</label>
        <input type="text" id="mArtist" placeholder="e.g. Stevie Wonder" />
        <label style="margin-top: 6px;" id="lblTitle">Album Title:</label>
        <input type="text" id="mTitle" placeholder="e.g. Songs in the Key of Life" />
        <label style="margin-top: 6px;" id="lblFormat">Format:</label>
        <select id="mFormat">
          <option value="CD">CD</option>
          <option value="Vinyl (LP)">Vinyl (LP)</option>
          <option value="Blu-ray">Blu-ray</option>
          <option value="SACD">SACD</option>
          <option value="Box Set">Box Set</option>
        </select>
        <label style="margin-top: 6px;" id="lblYear">Year:</label>
        <input type="tel" id="mYear" placeholder="e.g. 1976" />
        
        <!-- Opción de buscar/subir foto de portada física -->
        <label style="margin-top: 6px;" id="lblCustomCover">Physical Cover Photo (Fix cover match):</label>
        <div style="display: flex; gap: 6px; margin-top: 4px; align-items: center;">
          <button type="button" class="btn-secondary" style="margin-top:0; font-size:0.78rem;" onclick="document.getElementById('customCoverFile').click()" id="btnUploadCover">📷 Upload / Take Photo</button>
          <span id="coverStatusText" style="font-size: 0.72rem; color: var(--muted);">Default online cover</span>
        </div>

        <label style="margin-top: 6px;" id="lblCover">Cover URL (Optional):</label>
        <input type="text" id="mCover" placeholder="https://..." />
        <button class="btn-primary" id="btnSaveGithub" onclick="saveManualAlbum()">Save to library</button>
      </div>
    </div>
  </div>

  <!-- Modal de Edición Completa y Detalles -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailModalTitle">Album Details & Edit</h3>
        <button class="close-btn" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="detail-cover" id="detailCoverWrap">
        <div class="no-cover">💿</div>
      </div>

      <div class="edit-field-group">
        <label id="lblEditArtist">Artist</label>
        <input type="text" id="editArtist" class="edit-input" />
      </div>

      <div class="edit-field-group">
        <label id="lblEditTitle">Title</label>
        <input type="text" id="editTitle" class="edit-input" />
      </div>

      <div class="edit-field-group">
        <label id="lblEditFormat">Format</label>
        <select id="editFormat" class="edit-select">
          <option value="CD">CD</option>
          <option value="Vinyl (LP)">Vinyl (LP)</option>
          <option value="Blu-ray">Blu-ray</option>
          <option value="SACD">SACD</option>
          <option value="Box Set">Box Set</option>
        </select>
      </div>

      <div class="edit-field-group">
        <label id="lblEditYear">Year</label>
        <input type="tel" id="editYear" class="edit-input" />
      </div>

      <div class="edit-field-group">
        <label id="lblEditGenre">Genre</label>
        <input type="text" id="editGenre" class="edit-input" placeholder="e.g. Rock, Soul..." />
      </div>

      <div class="edit-field-group">
        <label id="lblEditCoverUrl">Cover URL or Custom Picture</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="editCoverUrl" class="edit-input" placeholder="Image URL..." />
          <button type="button" class="btn-secondary" style="width: auto; margin-top:0; font-size:0.75rem; white-space:nowrap;" onclick="document.getElementById('customCoverFile').click()">📷 Photo</button>
        </div>
      </div>

      <div class="edit-field-group">
        <label id="lblEditNotes">Notes / Personal Remarks</label>
        <textarea id="editNotes" class="notes-textarea" placeholder="Add personal notes..."></textarea>
      </div>

      <div class="edit-field-group">
        <label id="lblEditBarcode">Barcode</label>
        <input type="text" id="editBarcode" class="edit-input" style="opacity: 0.7;" readonly />
      </div>

      <div class="btn-actions-group">
        <button class="btn-primary" id="btnSaveAlbumChanges" onclick="saveAlbumChanges()" style="margin-top:0;">💾 Save Changes</button>
        <button class="btn-danger" id="btnDeleteAlbum" onclick="deleteCurrentAlbum()" style="margin-top:0;">🗑️ Delete</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "nefozoide";
    const GITHUB_REPO = "CWFML";
    const FILE_PATH = "database.json";

let backPressCount = 0;
    let backPressTimer = null;

    function setupDoubleBackToExit() {
      // Empujamos un estado inicial para capturar el primer "Atrás"
      history.pushState({ page: "home" }, "", "");

      window.addEventListener("popstate", (event) => {
        const scannerModal = document.getElementById("scannerModal");
        const detailModal = document.getElementById("detailModal");
        const searchInput = document.getElementById("searchInput");

        // 1. Si hay un modal abierto, ciérralo primero
        if (scannerModal.classList.contains("open")) {
          closeScanner();
          history.pushState({ page: "home" }, "", "");
          return;
        }
        if (detailModal.classList.contains("open")) {
          closeDetailModal();
          history.pushState({ page: "home" }, "", "");
          return;
        }

        // 2. Si hay texto en el buscador, limpia la búsqueda primero
        if (searchInput.value.trim() !== "") {
          searchInput.value = "";
          renderGrid();
          history.pushState({ page: "home" }, "", "");
          return;
        }

        // 3. Control de doble toque para salir de la app en la pantalla principal
        backPressCount++;
        if (backPressCount === 1) {
          // Opcional: Muestra un aviso sutil (toast) en lugar de alert
          const exitMsg = currentLang === "es" ? "Presiona 'Atrás' de nuevo para salir" : "Press 'Back' again to exit";
          showToast(exitMsg);

          // Volvemos a empujar el estado para mantener atrapado el botón
          history.pushState({ page: "home" }, "", "");

          // Restablece el contador después de 2 segundos
          backPressTimer = setTimeout(() => {
            backPressCount = 0;
          }, 2000);
        } else if (backPressCount >= 2) {
          clearTimeout(backPressTimer);
          // Permite que el navegador ejecute la salida real
          history.back();
        }
      });
    }

    // Función auxiliar para mostrar un aviso flotante (Toast) elegante
    function showToast(message) {
      let toast = document.getElementById("appToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "appToast";
        toast.style.cssText = "position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:#fff; padding:8px 16px; border-radius:20px; font-size:0.8rem; z-index:9999; transition:opacity 0.3s; pointer-events:none;";
        document.body.appendChild(toast);
      }
      toast.innerText = message;
      toast.style.opacity = "1";
      setTimeout(() => {
        toast.style.opacity = "0";
      }, 1800);
    }
    
    let allAlbums = [];
    let activeFormat = "ALL";
    let scannedBarcodeCache = "";
    let currentLang = localStorage.getItem("app_lang") || "en";
    let isProcessing = false;
    let deferredInstallPrompt = null;
    let selectedAlbumIndex = null;
    let tempCustomCoverBase64 = ""; // Variable temporal para la portada personalizada en base64

    const translations = {
      en: {
        title: "📀 My Library",
        searchPlaceholder: "Search artist, album, genre or barcode...",
        scanBtn: "📷 Scan or Search UPC",
        loading: "Loading library...",
        errorLoad: "Could not load database from library.",
        total: "titles",
        modalTitle: "Record Registration",
        detailTitle: "Album Details & Edit",
        warning: "⚠️ Not found in databases. Complete details:",
        artist: "Artist:",
        albumTitle: "Album Title:",
        format: "Format:",
        year: "Year:",
        coverUrl: "Cover URL (Optional):",
        save: "Save to library",
        search: "Search",
        enterBarcode: "Enter barcode digits...",
        lblEditArtist: "Artist",
        lblEditTitle: "Title",
        lblEditFormat: "Format",
        lblEditYear: "Year",
        lblEditGenre: "Genre",
        lblEditCoverUrl: "Cover URL or Custom Picture",
        lblEditNotes: "Notes / Personal Remarks",
        lblEditBarcode: "Barcode",
        notesPlaceholder: "Add personal notes...",
        saveChanges: "💾 Save Changes",
        deleteBtn: "🗑️ Delete",
        deleteConfirm: "Do you want to delete this album from your library?",
        optDateDesc: "📅 Newest added",
        optDateAsc: "📅 Oldest added",
        lblCustomCover: "Physical Cover Photo (Fix cover match):",
        btnUploadCover: "📷 Upload / Take Photo",
        coverStatusDefault: "Default online cover",
        coverStatusSet: "✅ Custom photo ready"
      },
      es: {
        title: "📀 Mi Biblioteca",
        searchPlaceholder: "Buscar artista, álbum, género o código...",
        scanBtn: "📷 Escanear o Buscar UPC",
        loading: "Cargando biblioteca...",
        errorLoad: "No se pudo cargar la base de datos.",
        total: "títulos",
        modalTitle: "Registro de Discos",
        detailTitle: "Detalles y Edición del Álbum",

    function renderGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const sortMode = document.getElementById("sortSelect").value;
      const container = document.getElementById("gridContainer");

      const filteredIndices = [];
      allAlbums.forEach((item, index) => {
        const matchesFormat = activeFormat === "ALL" || item.format === activeFormat;
        const matchesQuery = !q ||
          item.artist.toLowerCase().includes(q) ||
          item.title.toLowerCase().includes(q) ||
          (item.genre && item.genre.toLowerCase().includes(q)) ||
          (item.notes && item.notes.toLowerCase().includes(q)) ||
          item.barcode.includes(q);
        if (matchesFormat && matchesQuery) {
          filteredIndices.push({ item, index });
        }
      });

      filteredIndices.sort((a, b) => {
        const itemA = a.item;
        const itemB = b.item;

        if (sortMode === "date-desc") {
          return (itemB.timestamp || 0) - (itemA.timestamp || 0);
        } else if (sortMode === "date-asc") {
          return (itemA.timestamp || 0) - (itemB.timestamp || 0);
        } else if (sortMode === "artist-asc") {
          return (itemA.artist || "").localeCompare(itemB.artist || "");
        } else if (sortMode === "artist-desc") {
          return (itemB.artist || "").localeCompare(itemA.artist || "");
        } else if (sortMode === "title-asc") {
          return (itemA.title || "").localeCompare(itemB.title || "");
        } else if (sortMode === "year-desc") {
          return parseInt(itemB.year || 0) - parseInt(itemA.year || 0);
        } else if (sortMode === "year-asc") {
          return parseInt(itemA.year || 0) - parseInt(itemB.year || 0);
        }
        return 0;
      });

      if (filteredIndices.length === 0) {
        container.innerHTML = `<div class="loader">${currentLang === 'es' ? 'No se encontró el álbum.' : 'No records found.'}</div>`;
        return;
      }

      container.innerHTML = filteredIndices.map(({ item, index }) => `
        <div class="album-card" onclick="openAlbumDetail(${index})">
          <div class="cover-wrap">
            ${item.coverUrl ? `<img src="${item.coverUrl}" alt="${item.title}" loading="lazy" />` : `<div class="no-cover">💿</div>`}
            ${item.format ? `<span class="format-tag">${item.format}</span>` : ""}
          </div>
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="artist">${item.artist}</div>
            <div class="meta-row">
              <span class="year">${item.year || ""}</span>
              <span class="genre">${item.genre || item.notes || ""}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function saveAlbumChanges() {
      if (selectedAlbumIndex === null) return;
      const token = getToken();
      if (!token) { setupToken(); return; }

      const artist = document.getElementById("editArtist").value.trim();
      const title = document.getElementById("editTitle").value.trim();
      const format = document.getElementById("editFormat").value;
      const year = document.getElementById("editYear").value.trim();
      const genre = document.getElementById("editGenre").value.trim();
      const coverUrl = document.getElementById("editCoverUrl").value.trim();
      const notes = document.getElementById("editNotes").value.trim();

      if (!artist || !title) {
        alert(currentLang === 'es' ? "Artista y Título son obligatorios." : "Artist and Title are required.");
        return;
      }

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      const saveBtn = document.getElementById("btnSaveAlbumChanges");
      saveBtn.disabled = true;

      try {
        const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
          headers: { "Authorization": `token ${token}` },
          cache: "no-store"
        });
        if (!getRes.ok) throw new Error();
        const fileData = await getRes.json();
        
        let currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content)))) || [];
        
        if (currentContent[selectedAlbumIndex]) {
          currentContent[selectedAlbumIndex].artist = artist;
          currentContent[selectedAlbumIndex].title = title;
          currentContent[selectedAlbumIndex].format = format;
          currentContent[selectedAlbumIndex].year = year;
          currentContent[selectedAlbumIndex].genre = genre;
          currentContent[selectedAlbumIndex].coverUrl = coverUrl;
          currentContent[selectedAlbumIndex].notes = notes;
        }

        const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            message: `Update album details: ${artist} - ${title}`,
            content: updatedContentBase64,
            sha: fileData.sha
          })
        });

        if (!putRes.ok) throw new Error();

        saveBtn.disabled = false;
        closeDetailModal();
        await loadCollection();
      } catch (err) {
        saveBtn.disabled = false;
        alert(currentLang === 'es' ? "Error al guardar los cambios." : "Error saving changes.");

    // Manejar la subida o foto de la carátula personalizada
    function handleCustomCoverInput(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        // Redimensionar imagen en un canvas para optimizar tamaño antes de convertir a Base64
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          tempCustomCoverBase64 = canvas.toDataURL("image/jpeg", 0.85);

          // Si estamos en el modal de registro manual
          document.getElementById("mCover").value = tempCustomCoverBase64;
          document.getElementById("coverStatusText").innerText = translations[currentLang].coverStatusSet;

          // Si estamos en el modal de detalles abierto
          if (selectedAlbumIndex !== null) {
            document.getElementById("editCoverUrl").value = tempCustomCoverBase64;
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    async function processBarcode(code) {
      if (isProcessing) return;
      const barcode = String(code || "").replace(/[^0-9]/g, "").trim();
      if (!barcode) return;

      isProcessing = true;
      const searchBtn = document.getElementById("btnManualSearch");
      if (searchBtn) searchBtn.disabled = true;

      scannedBarcodeCache = barcode;
      const normCode = normalizeBarcode(barcode);

      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      document.getElementById("manualForm").classList.remove("active");

      try {
        const localDup = allAlbums.find(item => normalizeBarcode(item.barcode) === normCode);
        if (localDup) {
          showDuplicateAlert(resBox, localDup);
          return;
        }

        resBox.innerHTML = currentLang === 'es' 
          ? `🔍 Buscando código <b>${barcode}</b>...` 
          : `🔍 Searching barcode <b>${barcode}</b>...`;

        let meta = await lookupMusicBrainz(barcode);
        if (!meta.found) {
          meta = await lookupDiscogs(barcode);
        }

        if (!meta.found) {
          resBox.className = "result-box error";
          resBox.innerHTML = currentLang === 'es'
            ? `<strong>❌ No encontrado</strong><br>Código: ${barcode}. Complétalo abajo:`
            : `<strong>❌ Not found</strong><br>Barcode: ${barcode}. Fill details below:`;
          document.getElementById("manualForm").classList.add("active");
          document.getElementById("mArtist").value = "";
          document.getElementById("mTitle").value = "";
          document.getElementById("mYear").value = "";
          document.getElementById("mCover").value = "";
          return;
        }

        if (!meta.coverUrl) {
          meta.coverUrl = await lookupFallbackCover(meta.artist, meta.title);
        }

        const newAlbum = {
          barcode: barcode,
          artist: meta.artist,
          title: meta.title,
          format: meta.format,
          year: meta.year,
          genre: meta.genre || "",
          notes: "",
          coverUrl: meta.coverUrl,
          timestamp: Date.now()
        };

        await saveAlbumToGitHub(newAlbum);

        resBox.className = "result-box added";
        resBox.innerHTML = currentLang === 'es'
          ? `<strong>✅ ¡Listo!</strong><br>${meta.artist} – <i>${meta.title}</i> (${meta.format})`
          : `<strong>✅ Done!</strong><br>${meta.artist} – <i>${meta.title}</i> (${meta.format})`;
        await loadCollection();

        setTimeout(() => {
          closeScanner();
        }, 1200);

      } catch (err) {
        if (err && err.isDuplicate) {
          showDuplicateAlert(resBox, err.existingAlbum);
          await loadCollection();
        } else {
          resBox.className = "result-box error";
          resBox.innerHTML = currentLang === 'es' ? "❌ Error procesando el código." : "❌ Error processing barcode.";
        }
      } finally {
        isProcessing = false;
        if (searchBtn) searchBtn.disabled = false;
      }
    }

    function showDuplicateAlert(resBox, album) {
      resBox.className = "result-box duplicate";
      resBox.innerHTML = currentLang === 'es'
        ? `<strong>⚠️ ¡Ya esta en la biblioteca!</strong><br>${album.artist} – <i>${album.title}</i> (${album.format})`
        : `<strong>⚠️ Already in library!</strong><br>${album.artist} – <i>${album.title}</i> (${album.format})`;
    }

    async function lookupFallbackCover(artist, title) {
      try {
        const query = encodeURIComponent(`${artist} ${title}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=album&limit=1`);
        if (!res.ok) return "";
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
        }
        return "";
      } catch {
        return "";
      }
    }

    async function lookupMusicBrainz(barcode) {
      try {
        const res = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${barcode}&fmt=json`, {
          headers: { "User-Agent": "MusicCollectionInventory/1.0" }
        });
        const data = await res.json();
        if (!data.releases || data.releases.length === 0) return { found: false };

        const release = data.releases[0];
        const mbid = release.id;
        const artist = (release["artist-credit"] || []).map(a => a.name).join(", ");
        const title = release.title || "";
        const year = release.date ? release.date.substring(0, 4) : "";

        let format = "CD";
        if (release.media && release.media.length > 0 && release.media[0].format) {
          const rawFmt = release.media[0].format.toLowerCase();
          if (rawFmt.includes("blu-ray") || rawFmt.includes("bluray")) format = "Blu-ray";
          else if (rawFmt.includes("vinyl") || rawFmt.includes("lp")) format = "Vinyl (LP)";
          else if (rawFmt.includes("sacd")) format = "SACD";
          else if (release.media.length > 2 || rawFmt.includes("box")) format = "Box Set";
        }

        let genre = "";
        if (release.genres && release.genres.length > 0) {
          genre = release.genres.map(g => g.name).join(", ");
        } else if (release.tags && release.tags.length > 0) {
          genre = release.tags.slice(0, 2).map(t => t.name).join(", ");
        }

        let coverUrl = "";
        const caaRes = await fetch(`https://coverartarchive.org/release/${mbid}`);
        if (caaRes.ok) {
          const caaData = await caaRes.json();
          const frontImg = (caaData.images || []).find(img => img.front) || (caaData.images || [])[0];
          if (frontImg) coverUrl = (frontImg.thumbnails && (frontImg.thumbnails["500"] || frontImg.thumbnails["250"])) || frontImg.image || "";
        }

        return { found: true, artist, title, format, year, genre, coverUrl };
      } catch {
        return { found: false };
      }
    }

    async function lookupDiscogs(barcode) {
      try {
        const res = await fetch(`https://api.discogs.com/database/search?barcode=${barcode}&type=release`, {
          headers: { "User-Agent": "MusicCollectionApp/1.0" }
        });
        const data = await res.json();
        if (!data.results || data.results.length === 0) return { found: false };

        const item = data.results[0];
        const titleParts = (item.title || "").split(" - ");
        const artist = titleParts.length > 1 ? titleParts[0] : "Unknown Artist";
        const title = titleParts.length > 1 ? titleParts.slice(1).join(" - ") : item.title;
        const year = item.year ? String(item.year) : "";
        let coverUrl = item.cover_image || "";
        if (coverUrl.includes("spacer.gif")) coverUrl = "";

        let format = "CD";
        const fmtStr = (item.format || []).join(" ").toLowerCase();
        if (fmtStr.includes("blu-ray")) format = "Blu-ray";
        else if (fmtStr.includes("vinyl") || fmtStr.includes("lp")) format = "Vinyl (LP)";
        else if (fmtStr.includes("sacd")) format = "SACD";
        else if (fmtStr.includes("box set")) format = "Box Set";

        let genre = (item.genre || []).join(", ");

        return { found: true, artist, title, format, year, genre, coverUrl };
      } catch {
        return { found: false };
      }
    }

    async function saveManualAlbum() {
      if (isProcessing) return;
      const artist = document.getElementById("mArtist").value.trim();
      const title = document.getElementById("mTitle").value.trim();
      const format = document.getElementById("mFormat").value;
      const year = document.getElementById("mYear").value.trim();
      let coverUrl = document.getElementById("mCover").value.trim();

      if (!artist || !title) { 
        alert(currentLang === 'es' ? "Completa al menos Artista y Título." : "Complete at least Artist and Title."); 
        return; 
      }

      isProcessing = true;
      const saveBtn = document.getElementById("btnSaveGithub");
      saveBtn.disabled = true;

      const resBox = document.getElementById("scanResult");
      resBox.innerHTML = currentLang === 'es' ? "💾 Guardando álbum..." : "💾 Saving album...";

      if (!coverUrl) {
        coverUrl = await lookupFallbackCover(artist, title);
      }

      const newAlbum = { 
        barcode: scannedBarcodeCache || "manual-" + Date.now(), 
        artist, 
        title, 
        format, 
        year, 
        genre: "", 
        notes: "", 
        coverUrl,
        timestamp: Date.now()
      };

      try {
        await saveAlbumToGitHub(newAlbum);
        resBox.className = "result-box added";
        resBox.innerHTML = currentLang === 'es'
          ? `<strong>✅ ¡Guardado con éxito!</strong><br>${artist} – <i>${title}</i>`
          : `<strong>✅ Saved successfully!</strong><br>${artist} – <i>${title}</i>`;
        document.getElementById("manualForm").classList.remove("active");
        await loadCollection();

        setTimeout(() => {
          closeScanner();
        }, 1200);

      } catch (err) {
        if (err && err.isDuplicate) {
          showDuplicateAlert(resBox, err.existingAlbum);
          document.getElementById("manualForm").classList.remove("active");
          await loadCollection();
        } else {
          resBox.className = "result-box error";
          resBox.innerHTML = currentLang === 'es' ? "❌ Error al guardar. Token inválido." : "❌ Save error. Invalid Token.";
        }
      } finally {
        isProcessing = false;
        saveBtn.disabled = false;
      }
    }

    async function saveAlbumToGitHub(newAlbum) {
      const token = getToken();
      if (!token) { setupToken(); throw new Error("Token requerido"); }

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      
      const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
        headers: { "Authorization": `token ${token}` },
        cache: "no-store"
      });
      if (!getRes.ok) throw new Error();
      const fileData = await getRes.json();
      
      const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content)))) || [];

      const strictDuplicate = currentContent.find(item => {
        const b1 = normalizeBarcode(item.barcode);
        const b2 = normalizeBarcode(newAlbum.barcode);
        if (b1 && b2 && b1 === b2 && !b1.startsWith("manual")) return true;
        return (item.artist.toLowerCase().trim() === newAlbum.artist.toLowerCase().trim() &&
                item.title.toLowerCase().trim() === newAlbum.title.toLowerCase().trim() &&
                item.format === newAlbum.format);
      });

      if (strictDuplicate && !newAlbum.barcode.startsWith("manual")) {
        throw { isDuplicate: true, existingAlbum: strictDuplicate };
      }

      currentContent.unshift(newAlbum);
      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `Add album: ${newAlbum.artist} - ${newAlbum.title}`,
          content: updatedContentBase64,
          sha: fileData.sha
        })
      });

      if (!putRes.ok) throw new Error();
    }
  </script>
