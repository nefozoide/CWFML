<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>Record Collection</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #0f1115; --card: #181b22; --accent: #1db954; --warn: #f59e0b;
      --text: #f3f4f6; --muted: #9ca3af; --border: #2a2f3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(12px);
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .welcome-banner {
      font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-bottom: 6px;
      letter-spacing: -0.01em; animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    h1 { font-size: 1.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions-group { display: flex; gap: 6px; align-items: center; }
    
    .lang-icon-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; overflow: hidden;
      transition: transform 0.1s;
    }
    .lang-icon-btn:active { transform: scale(0.92); }
    .lang-icon-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }

    .btn-small { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 9px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; height: 28px; display: flex; align-items: center; }
    .badge-count { background: var(--card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; height: 28px; display: flex; align-items: center; }

    .search-box {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 0.95rem; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-top: 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; padding: 16px; }
    .album-card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .cover-wrap { width: 100%; aspect-ratio: 1 / 1; background: #232732; display: flex; align-items: center; justify-content: center; position: relative; }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .no-cover { font-size: 2.2rem; color: #4b5563; }
    .format-tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .info { padding: 10px 12px; }
    .title { font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .artist { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 6px; }
    .year { font-size: 0.72rem; color: #6b7280; }
    .genre { font-size: 0.7rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fab {
      position: fixed; bottom: 22px; right: 20px; left: 20px; max-width: 420px; margin: 0 auto;
      background: var(--accent); color: #000; border: none; border-radius: 16px;
      padding: 15px 20px; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(29, 185, 84, 0.35); cursor: pointer; z-index: 30;
    }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); color: var(--text); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }

    .manual-row { display: flex; gap: 8px; margin-top: 10px; }
    .manual-row input, .manual-row select { flex: 1; padding: 11px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none; }
    .btn-primary { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-secondary { background: var(--border); color: var(--text); border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
    
    .result-box { margin-top: 14px; padding: 14px; border-radius: 12px; display: none; color: var(--text); }
    .result-box.duplicate { display: block; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warn); }
    .result-box.added { display: block; background: rgba(29, 185, 84, 0.15); border: 1px solid var(--accent); }
    .result-box.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
    .loader { text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1; }
    .form-group { margin-top: 12px; display: none; }
    .form-group.active { display: block; }
    label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="welcome-banner">Hey You! 👋</div>
    <div class="top-bar">
      <h1 id="appTitle">🎵 My Record Collection</h1>
      <div class="actions-group">
        <button class="lang-icon-btn" onclick="toggleLanguage()" title="Cambiar Idioma / Change Language">
          <img src="https://play-lh.googleusercontent.com/L-NOoF7qLgO3m-pP-A7IF1X2AiCSyL2iF_AOv9rNqFjQWBznDtFXjDrtujXEJa9NfPaNOXLR7inEQ_QuFfZd-QQ=s0-br30" alt="ES/EN" />
        </button>
        <button class="btn-small" id="configBtn" onclick="setupToken()">⚙️ Setup</button>
        <span class="badge-count" id="totalCount">Loading...</span>
      </div>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="Search artist, album, genre or barcode..." oninput="renderGrid()" />
    <div class="filters">
      <div class="chip active" onclick="setFilter('ALL', this)" data-key="all">All</div>
      <div class="chip" onclick="setFilter('Vinyl (LP)', this)">Vinyl (LP)</div>
      <div class="chip" onclick="setFilter('SACD', this)">SACD</div>
      <div class="chip" onclick="setFilter('CD', this)">CD</div>
      <div class="chip" onclick="setFilter('Blu-ray', this)">Blu-ray</div>
      <div class="chip" onclick="setFilter('Box Set', this)">Box Set</div>
    </div>
  </header>

  <main id="gridContainer" class="grid">
    <div class="loader" id="loadingText">Loading collection from GitHub...</div>
  </main>

  <button class="fab" id="fabBtn" onclick="openScannerModal()">
    📷 Scan or Search UPC
  </button>

  <input type="file" id="barcodeInputFile" accept="image/*" capture="environment" style="display:none;" onchange="handleBarcodeInput(event)">

  <div class="modal-backdrop" id="scannerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Record Registration</h3>
        <button class="close-btn" onclick="closeScanner()">✕</button>
      </div>

      <div id="scannerOptions">
        <button class="btn-primary" onclick="document.getElementById('barcodeInputFile').click()">📸 Take photo of barcode / Tomar foto</button>
        <button class="btn-secondary" onclick="showManualInputMode()">⌨️ Type barcode manually / Escribir código</button>
      </div>

      <div id="manualInputContainer" style="display:none; margin-top: 10px;">
        <div class="manual-row">
          <input type="tel" id="manualBarcode" placeholder="Enter barcode digits..." />
          <button class="btn-primary" style="width: auto; margin-top:0;" onclick="processBarcode(document.getElementById('manualBarcode').value)">Search</button>
        </div>
      </div>

      <div id="scanResult" class="result-box"></div>

      <div id="manualForm" class="form-group">
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        <p style="font-size: 0.85rem; color: var(--warn); margin-bottom: 10px;" id="warningText">⚠️ Not found in databases. Complete details:</p>
        <label id="lblArtist">Artist:</label>
        <input type="text" id="mArtist" placeholder="e.g. Stevie Wonder" />
        <label style="margin-top: 8px;" id="lblTitle">Album Title:</label>
        <input type="text" id="mTitle" placeholder="e.g. Songs in the Key of Life" />
        <label style="margin-top: 8px;" id="lblFormat">Format:</label>
        <select id="mFormat">
          <option value="CD">CD</option>
          <option value="Vinyl (LP)">Vinyl (LP)</option>
          <option value="Blu-ray">Blu-ray</option>
          <option value="SACD">SACD</option>
          <option value="Box Set">Box Set</option>
        </select>
        <label style="margin-top: 8px;" id="lblYear">Year:</label>
        <input type="tel" id="mYear" placeholder="e.g. 1976" />
        <label style="margin-top: 8px;" id="lblCover">Cover URL (Optional):</label>
        <input type="text" id="mCover" placeholder="https://..." />
        <button class="btn-primary" id="btnSaveGithub" onclick="saveManualAlbum()">Save to GitHub</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "nefozoide";
    const GITHUB_REPO = "CWFML";
    const FILE_PATH = "database.json";

    let allAlbums = [];
    let activeFormat = "ALL";
    let scannedBarcodeCache = "";
    let currentLang = localStorage.getItem("app_lang") || "en";

    const translations = {
      en: {
        title: "🎵 My Record Collection",
        searchPlaceholder: "Search artist, album, genre or barcode...",
        scanBtn: "📷 Scan or Search UPC",
        loading: "Loading collection from GitHub...",
        errorLoad: "Could not load database from GitHub.",
        total: "titles",
        modalTitle: "Record Registration",
        warning: "⚠️ Not found in databases. Complete details:",
        artist: "Artist:",
        albumTitle: "Album Title:",
        format: "Format:",
        year: "Year:",
        coverUrl: "Cover URL (Optional):",
        save: "Save to GitHub",
        search: "Search",
        typeManual: "⌨️ Type barcode manually",
        takePhoto: "📸 Take photo of barcode",
        enterBarcode: "Enter barcode digits...",
        notAdded: "Could not process code."
      },
      es: {
        title: "🎵 Mi Discoteca",
        searchPlaceholder: "Buscar artista, álbum, género o código...",
        scanBtn: "📷 Escanear o Buscar UPC",
        loading: "Cargando colección desde GitHub...",
        errorLoad: "No se pudo cargar la base de datos de GitHub.",
        total: "títulos",
        modalTitle: "Registro de Discos",
        warning: "⚠️ No registrado en bases de datos. Completa:",
        artist: "Artista:",
        albumTitle: "Título del Álbum:",
        format: "Formato:",
        year: "Año:",
        coverUrl: "URL de Portada (Opcional):",
        save: "Guardar en GitHub",
        search: "Buscar",
        typeManual: "⌨️ Escribir código manualmente",
        takePhoto: "📸 Tomar foto del código de barras",
        enterBarcode: "Escribe el código de barras...",
        notAdded: "Error procesando el código."
      }
    };

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }

    window.onload = () => {
      applyLanguage();
      loadCollection();
    };

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "es" : "en";
      localStorage.setItem("app_lang", currentLang);
      applyLanguage();
    }

    function applyLanguage() {
      const t = translations[currentLang];
      document.getElementById("appTitle").innerText = t.title;
      document.getElementById("searchInput").placeholder = t.searchPlaceholder;
      document.getElementById("fabBtn").innerHTML = t.scanBtn;
      document.getElementById("loadingText").innerText = t.loading;
      document.getElementById("modalTitle").innerText = t.modalTitle;
      document.getElementById("warningText").innerText = t.warning;
      document.getElementById("lblArtist").innerText = t.artist;
      document.getElementById("lblTitle").innerText = t.albumTitle;
      document.getElementById("lblFormat").innerText = t.format;
      document.getElementById("lblYear").innerText = t.year;
      document.getElementById("lblCover").innerText = t.coverUrl;
      document.getElementById("btnSaveGithub").innerText = t.save;
      
      document.getElementById("configBtn").innerText = currentLang === "es" ? "⚙️ Config" : "⚙️ Setup";
      document.getElementById("manualBarcode").placeholder = t.enterBarcode;
      
      const countEl = document.getElementById("totalCount");
      if(allAlbums.length >= 0) countEl.innerText = allAlbums.length + " " + t.total;
    }

    function getToken() { return localStorage.getItem("gh_token") || ""; }
    function setupToken() {
      const promptText = currentLang === "es" 
        ? "Ingresa tu Token de acceso personal de GitHub (con permisos de repo):" 
        : "Enter your GitHub Personal Access Token (with repo permissions):";
      const token = prompt(promptText, getToken());
      if (token !== null) { localStorage.setItem("gh_token", token.trim()); alert(currentLang === "es" ? "¡Token guardado!" : "Token saved!"); loadCollection(); }
    }

    async function loadCollection() {
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        allAlbums = await res.json() || [];
        const t = translations[currentLang];
        document.getElementById("totalCount").innerText = allAlbums.length + " " + t.total;
        renderGrid();
      } catch (err) {
        document.getElementById("totalCount").innerText = "Error";
        const t = translations[currentLang];
        document.getElementById("gridContainer").innerHTML = `<div class="loader">${t.errorLoad}</div>`;
      }
    }

    function setFilter(format, el) {
      activeFormat = format;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderGrid();
    }

    function renderGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("gridContainer");

      const filtered = allAlbums.filter(item => {
        const matchesFormat = activeFormat === "ALL" || item.format === activeFormat;
        const matchesQuery = !q || item.artist.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || (item.genre && item.genre.toLowerCase().includes(q)) || item.barcode.includes(q);
        return matchesFormat && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="loader">${currentLang === 'es' ? 'No se encontraron discos con ese filtro.' : 'No records found.'}</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="album-card">
          <div class="cover-wrap">
            ${item.coverUrl ? `<img src="${item.coverUrl}" alt="${item.title}" loading="lazy" />` : `<div class="no-cover">💿</div>`}
            ${item.format ? `<span class="format-tag">${item.format}</span>` : ""}
          </div>
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="artist">${item.artist}</div>
            <div class="meta-row">
              <span class="year">${item.year || ""}</span>
              <span class="genre">${item.genre || ""}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function openScannerModal() {
      document.getElementById("scannerOptions").style.display = "block";
      document.getElementById("manualInputContainer").style.display = "none";
      document.getElementById("scannerModal").classList.add("open");
      document.getElementById("scanResult").style.display = "none";
      document.getElementById("manualForm").classList.remove("active");
    }

    function closeScanner() {
      document.getElementById("scannerModal").classList.remove("open");
      document.getElementById("manualForm").classList.remove("active");
    }

    function showManualInputMode() {
      document.getElementById("scannerOptions").style.display = "none";
      document.getElementById("manualInputContainer").style.display = "block";
      document.getElementById("manualBarcode").focus();
    }

    async function handleBarcodeInput(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("scannerOptions").style.display = "none";
      document.getElementById("manualInputContainer").style.display = "block";
      
      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      resBox.innerHTML = currentLang === 'es' ? "🔍 Analizando foto del código..." : "🔍 Analyzing barcode photo...";
      document.getElementById("manualForm").classList.remove("active");
      document.getElementById("scannerModal").classList.add("open");

      try {
        const html5QrCode = new Html5Qrcode("scanResult");
        const decodedText = await html5QrCode.scanFile(file, true);
        if (decodedText) {
          document.getElementById("manualBarcode").value = decodedText;
          processBarcode(decodedText);
        }
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = currentLang === 'es' 
          ? "⚠️ No se leyó automáticamente. Escribe el número del código abajo:" 
          : "⚠️ Could not read automatically. Type the barcode below:";
      } finally {
        event.target.value = "";
      }
    }

    async function processBarcode(code) {
      const barcode = String(code || "").replace(/[^0-9]/g, "").trim();
      if (!barcode) return;
      scannedBarcodeCache = barcode;

      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      document.getElementById("manualForm").classList.remove("active");

      const duplicate = allAlbums.find(item => item.barcode === barcode);
      if (duplicate) {
        resBox.className = "result-box duplicate";
        resBox.innerHTML = currentLang === 'es'
          ? `<strong>⚠️ ¡Ya lo tienes!</strong><br>${duplicate.artist} – <i>${duplicate.title}</i> (${duplicate.format})`
          : `<strong>⚠️ Already in collection!</strong><br>${duplicate.artist} – <i>${duplicate.title}</i> (${duplicate.format})`;
        return;
      }

      resBox.innerHTML = currentLang === 'es' 
        ? `🔍 Buscando código <b>${barcode}</b>...` 
        : `🔍 Searching barcode <b>${barcode}</b>...`;

      try {
        let meta = await lookupMusicBrainz(barcode);
        if (!meta.found) {
          meta = await lookupDiscogs(barcode);
        }

        if (!meta.found) {
          resBox.className = "result-box error";
          resBox.innerHTML = currentLang === 'es'
            ? `<strong>❌ No encontrado</strong><br>Código: ${barcode}. Complétalo abajo:`
            : `<strong>❌ Not found</strong><br>Barcode: ${barcode}. Fill details below:`;
          document.getElementById("manualForm").classList.add("active");
          document.getElementById("mArtist").value = "";
          document.getElementById("mTitle").value = "";
          document.getElementById("mYear").value = "";
          document.getElementById("mCover").value = "";
          return;
        }

        const newAlbum = {
          barcode: barcode,
          artist: meta.artist,
          title: meta.title,
          format: meta.format,
          year: meta.year,
          genre: meta.genre,
          coverUrl: meta.coverUrl
        };

        await saveAlbumToGitHub(newAlbum);
        resBox.className = "result-box added";
        resBox.innerHTML = currentLang === 'es'
          ? `<strong>✅ ¡Agregado a GitHub!</strong><br>${meta.artist} – <i>${meta.title}</i> (${meta.format})`
          : `<strong>✅ Added to GitHub!</strong><br>${meta.artist} – <i>${meta.title}</i> (${meta.format})`;
        loadCollection();
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = currentLang === 'es' ? "❌ Error procesando el código." : "❌ Error processing barcode.";
      }
    }

    async function lookupMusicBrainz(barcode) {
      try {
        const res = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${barcode}&fmt=json`, {
          headers: { "User-Agent": "MusicCollectionInventory/1.0" }
        });
        const data = await res.json();
        if (!data.releases || data.releases.length === 0) return { found: false };

        const release = data.releases[0];
        const mbid = release.id;
        const artist = (release["artist-credit"] || []).map(a => a.name).join(", ");
        const title = release.title || "";
        const year = release.date ? release.date.substring(0, 4) : "";

        let format = "CD";
        if (release.media && release.media.length > 0 && release.media[0].format) {
          const rawFmt = release.media[0].format.toLowerCase();
          if (rawFmt.includes("blu-ray") || rawFmt.includes("bluray")) format = "Blu-ray";
          else if (rawFmt.includes("vinyl") || rawFmt.includes("lp")) format = "Vinyl (LP)";
          else if (rawFmt.includes("sacd")) format = "SACD";
          else if (release.media.length > 2 || rawFmt.includes("box")) format = "Box Set";
        }

        let genre = "";
        if (release.genres && release.genres.length > 0) {
          genre = release.genres.map(g => g.name).join(", ");
        } else if (release.tags && release.tags.length > 0) {
          genre = release.tags.slice(0, 2).map(t => t.name).join(", ");
        }

        let coverUrl = "";
        const caaRes = await fetch(`https://coverartarchive.org/release/${mbid}`);
        if (caaRes.ok) {
          const caaData = await caaRes.json();
          const frontImg = (caaData.images || []).find(img => img.front) || (caaData.images || [])[0];
          if (frontImg) coverUrl = (frontImg.thumbnails && (frontImg.thumbnails["500"] || frontImg.thumbnails["250"])) || frontImg.image || "";
        }

        return { found: true, artist, title, format, year, genre, coverUrl };
      } catch {
        return { found: false };
      }
    }

    async function lookupDiscogs(barcode) {
      try {
        const res = await fetch(`https://api.discogs.com/database/search?barcode=${barcode}&type=release`, {
          headers: { "User-Agent": "MusicCollectionApp/1.0" }
        });
        const data = await res.json();
        if (!data.results || data.results.length === 0) return { found: false };

        const item = data.results[0];
        const titleParts = (item.title || "").split(" - ");
        const artist = titleParts.length > 1 ? titleParts[0] : "Unknown Artist";
        const title = titleParts.length > 1 ? titleParts.slice(1).join(" - ") : item.title;
        const year = item.year ? String(item.year) : "";
        const coverUrl = item.cover_image || "";

        let format = "CD";
        const fmtStr = (item.format || []).join(" ").toLowerCase();
        if (fmtStr.includes("blu-ray")) format = "Blu-ray";
        else if (fmtStr.includes("vinyl") || fmtStr.includes("lp")) format = "Vinyl (LP)";
        else if (fmtStr.includes("sacd")) format = "SACD";
        else if (fmtStr.includes("box set")) format = "Box Set";

        let genre = (item.genre || []).join(", ");

        return { found: true, artist, title, format, year, genre, coverUrl };
      } catch {
        return { found: false };
      }
    }

    async function saveManualAlbum() {
      const artist = document.getElementById("mArtist").value.trim();
      const title = document.getElementById("mTitle").value.trim();
      const format = document.getElementById("mFormat").value;
      const year = document.getElementById("mYear").value.trim();
      const coverUrl = document.getElementById("mCover").value.trim();

      if (!artist || !title) { 
        alert(currentLang === 'es' ? "Completa al menos Artista y Título." : "Complete at least Artist and Title."); 
        return; 
      }

      const newAlbum = { barcode: scannedBarcodeCache, artist, title, format, year, genre: "", coverUrl };
      const resBox = document.getElementById("scanResult");
      resBox.innerHTML = currentLang === 'es' ? "💾 Guardando en GitHub..." : "💾 Saving to GitHub...";

      try {
        await saveAlbumToGitHub(newAlbum);
        resBox.className = "result-box added";
        resBox.innerHTML = currentLang === 'es'
          ? `<strong>✅ ¡Guardado con éxito!</strong><br>${artist} – <i>${title}</i>`
          : `<strong>✅ Saved successfully!</strong><br>${artist} – <i>${title}</i>`;
        document.getElementById("manualForm").classList.remove("active");
        loadCollection();
      } catch {
        resBox.className = "result-box error";
        resBox.innerHTML = currentLang === 'es' ? "❌ Error al guardar. Token inválido." : "❌ Save error. Invalid Token.";
      }
    }

    async function saveAlbumToGitHub(newAlbum) {
      const token = getToken();
      if (!token) { setupToken(); throw new Error("Token requerido"); }

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
      if (!getRes.ok) throw new Error();
      const fileData = await getRes.json();
      
      const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
      currentContent.unshift(newAlbum);

      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `Add album: ${newAlbum.artist} - ${newAlbum.title}`,
          content: updatedContentBase64,
          sha: fileData.sha
        })
      });

      if (!putRes.ok) throw new Error();
    }
  </script>
