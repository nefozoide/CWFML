<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>Mi Colección de Música</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #0f1115; --card: #181b22; --accent: #1db954; --warn: #f59e0b;
      --text: #f3f4f6; --muted: #9ca3af; --border: #2a2f3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(12px);
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .config-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
    .badge-count { background: var(--card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; color: var(--muted); }

    .search-box {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 0.95rem; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-top: 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; padding: 16px; }
    .album-card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .cover-wrap { width: 100%; aspect-ratio: 1 / 1; background: #232732; display: flex; align-items: center; justify-content: center; position: relative; }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .no-cover { font-size: 2.2rem; color: #4b5563; }
    .format-tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .info { padding: 10px 12px; }
    .title { font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .artist { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 6px; }
    .year { font-size: 0.72rem; color: #6b7280; }
    .genre { font-size: 0.7rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fab {
      position: fixed; bottom: 22px; right: 20px; left: 20px; max-width: 420px; margin: 0 auto;
      background: var(--accent); color: #000; border: none; border-radius: 16px;
      padding: 15px 20px; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(29, 185, 84, 0.35); cursor: pointer; z-index: 30;
    }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); color: var(--text); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }

    .manual-row { display: flex; gap: 8px; margin-top: 10px; }
    .manual-row input, .manual-row select { flex: 1; padding: 11px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none; }
    .btn-primary { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .result-box { margin-top: 14px; padding: 14px; border-radius: 12px; display: none; color: var(--text); }
    .result-box.duplicate { display: block; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warn); }
    .result-box.added { display: block; background: rgba(29, 185, 84, 0.15); border: 1px solid var(--accent); }
    .result-box.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
    .loader { text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1; }
    .form-group { margin-top: 12px; display: none; }
    .form-group.active { display: block; }
    label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>🎵 Mi Discoteca</h1>
      <button class="config-btn" onclick="setupToken()">⚙️ Configurar</button>
      <span class="badge-count" id="totalCount">Cargando...</span>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="Buscar artista, álbum, género o código..." oninput="renderGrid()" />
    <div class="filters">
      <div class="chip active" onclick="setFilter('ALL', this)">Todos</div>
      <div class="chip" onclick="setFilter('Vinyl (LP)', this)">Vinyl (LP)</div>
      <div class="chip" onclick="setFilter('SACD', this)">SACD</div>
      <div class="chip" onclick="setFilter('CD', this)">CD</div>
      <div class="chip" onclick="setFilter('Blu-ray', this)">Blu-ray</div>
      <div class="chip" onclick="setFilter('Box Set', this)">Box Set</div>
    </div>
  </header>

  <main id="gridContainer" class="grid">
    <div class="loader">Cargando colección desde GitHub...</div>
  </main>

  <button class="fab" onclick="document.getElementById('barcodeInputFile').click()">
    📷 Escanear o Buscar UPC
  </button>

  <input type="file" id="barcodeInputFile" accept="image/*" capture="environment" style="display:none;" onchange="handleBarcodeInput(event)">

  <div class="modal-backdrop" id="scannerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Registro de Discos</h3>
        <button class="close-btn" onclick="closeScanner()">✕</button>
      </div>

      <div class="manual-row">
        <input type="tel" id="manualBarcode" placeholder="Escribe código de barras..." />
        <button class="btn-primary" style="width: auto; margin-top:0;" onclick="processBarcode(document.getElementById('manualBarcode').value)">Buscar</button>
      </div>

      <div id="scanResult" class="result-box"></div>

      <div id="manualForm" class="form-group">
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        <p style="font-size: 0.85rem; color: var(--warn); margin-bottom: 10px;">⚠️ No registrado en base de datos. Completa los datos:</p>
        <label>Artista:</label>
        <input type="text" id="mArtist" placeholder="Ej. Stevie Wonder" />
        <label style="margin-top: 8px;">Título del Álbum:</label>
        <input type="text" id="mTitle" placeholder="Ej. Songs in the Key of Life" />
        <label style="margin-top: 8px;">Formato:</label>
        <select id="mFormat">
          <option value="CD">CD</option>
          <option value="Vinyl (LP)">Vinyl (LP)</option>
          <option value="Blu-ray">Blu-ray</option>
          <option value="SACD">SACD</option>
          <option value="Box Set">Box Set</option>
        </select>
        <label style="margin-top: 8px;">Año:</label>
        <input type="tel" id="mYear" placeholder="Ej. 1976" />
        <label style="margin-top: 8px;">URL de Portada (Opcional):</label>
        <input type="text" id="mCover" placeholder="https://..." />
        <button class="btn-primary" onclick="saveManualAlbum()">Guardar en GitHub</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
    const GITHUB_USER = "nefozoide";
    const GITHUB_REPO = "CWFML";
    const FILE_PATH = "database.json";

    let allAlbums = [];
    let activeFormat = "ALL";
    let scannedBarcodeCache = "";

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }

    window.onload = loadCollection;

    function getToken() {
      return localStorage.getItem("gh_token") || "";
    }

    function setupToken() {
      const current = getToken();
      const token = prompt("Ingresa tu Token de acceso personal de GitHub (con permisos de repo):", current);
      if (token !== null) {
        localStorage.setItem("gh_token", token.trim());
        alert("¡Token guardado correctamente!");
        loadCollection();
      }
    }

    async function loadCollection() {
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("No se pudo cargar");
        allAlbums = await res.json() || [];
        document.getElementById("totalCount").innerText = allAlbums.length + " títulos";
        renderGrid();
      } catch (err) {
        document.getElementById("totalCount").innerText = "Error";
        document.getElementById("gridContainer").innerHTML = '<div class="loader">No se pudo cargar la base de datos de GitHub.</div>';
      }
    }

    function setFormat(format, el) {
      activeFormat = format;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderGrid();
    }

    function setFilter(format, el) { setFormat(format, el); }

    function renderGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("gridContainer");

      const filtered = allAlbums.filter(item => {
        const matchesFormat = activeFormat === "ALL" || item.format === activeFormat;
        const matchesQuery = !q || item.artist.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || (item.genre && item.genre.toLowerCase().includes(q)) || item.barcode.includes(q);
        return matchesFormat && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loader">No se encontraron discos con ese filtro.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="album-card">
          <div class="cover-wrap">
            ${item.coverUrl ? `<img src="${item.coverUrl}" alt="${item.title}" loading="lazy" />` : `<div class="no-cover">💿</div>`}
            ${item.format ? `<span class="format-tag">${item.format}</span>` : ""}
          </div>
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="artist">${item.artist}</div>
            <div class="meta-row">
              <span class="year">${item.year || ""}</span>
              <span class="genre">${item.genre || ""}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function closeScanner() {
      document.getElementById("scannerModal").classList.remove("open");
      document.getElementById("manualForm").classList.remove("active");
    }

    async function handleBarcodeInput(event) {
      const file = event.target.files[0];
      if (!file) return;

      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      resBox.innerHTML = "🔍 Analizando foto del código de barras...";
      document.getElementById("manualForm").classList.remove("active");
      document.getElementById("scannerModal").classList.add("open");

      try {
        const html5QrCode = new Html5Qrcode("scanResult");
        const decodedText = await html5QrCode.scanFile(file, true);
        if (decodedText) {
          document.getElementById("manualBarcode").value = decodedText;
          processBarcode(decodedText);
        }
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = "⚠️ No se leyó automáticamente. Escribe el número del código abajo:";
      } finally {
        event.target.value = "";
      }
    }

    async function processBarcode(code) {
      const barcode = String(code || "").replace(/[^0-9]/g, "").trim();
      if (!barcode) return;
      scannedBarcodeCache = barcode;

      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      document.getElementById("manualForm").classList.remove("active");

      // 1. Revisar si ya existe en la base de datos local
      const duplicate = allAlbums.find(item => item.barcode === barcode);
      if (duplicate) {
        resBox.className = "result-box duplicate";
        resBox.innerHTML = `<strong>⚠️ ¡Ya lo tienes!</strong><br>${duplicate.artist} – <i>${duplicate.title}</i> (${duplicate.format})`;
        return;
      }

      resBox.innerHTML = `🔍 Consultando código <b>${barcode}</b> en MusicBrainz...`;

      // 2. Buscar en MusicBrainz
      try {
        const meta = await lookupMusicBrainz(barcode);
        if (!meta.found) {
          resBox.className = "result-box error";
          resBox.innerHTML = `<strong>❌ No encontrado en MusicBrainz</strong><br>Código: ${barcode}. Completa los datos manualmente abajo:`;
          document.getElementById("manualForm").classList.add("active");
          return;
        }

        // Agregar el álbum a GitHub
        const newAlbum = {
          barcode: barcode,
          artist: meta.artist,
          title: meta.title,
          format: meta.format,
          year: meta.year,
          genre: meta.genre,
          coverUrl: meta.coverUrl
        };

        await saveAlbumToGitHub(newAlbum);
        resBox.className = "result-box added";
        resBox.innerHTML = `<strong>✅ ¡Agregado a GitHub!</strong><br>${meta.artist} – <i>${meta.title}</i> (${meta.format})`;
        loadCollection();
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = `❌ Error procesando el código.`;
      }
    }

    async function lookupMusicBrainz(barcode) {
      try {
        const res = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${barcode}&fmt=json`, {
          headers: { "User-Agent": "MusicCollectionInventory/1.0" }
        });
        const data = await res.json();
        if (!data.releases || data.releases.length === 0) return { found: false };

        const release = data.releases[0];
        const mbid = release.id;
        const artist = (release["artist-credit"] || []).map(a => a.name).join(", ");
        const title = release.title || "";
        const year = release.date ? release.date.substring(0, 4) : "";

        let format = "CD";
        if (release.media && release.media.length > 0 && release.media[0].format) {
          const rawFmt = release.media[0].format.toLowerCase();
          if (rawFmt.includes("blu-ray") || rawFmt.includes("bluray")) format = "Blu-ray";
          else if (rawFmt.includes("vinyl") || rawFmt.includes("lp")) format = "Vinyl (LP)";
          else if (rawFmt.includes("sacd")) format = "SACD";
          else if (release.media.length > 2 || rawFmt.includes("box")) format = "Box Set";
        }

        let genre = "";
        if (release.genres && release.genres.length > 0) {
          genre = release.genres.map(g => g.name).join(", ");
        } else if (release.tags && release.tags.length > 0) {
          genre = release.tags.slice(0, 2).map(t => t.name).join(", ");
        }

        let coverUrl = "";
        const caaRes = await fetch(`https://coverartarchive.org/release/${mbid}`);
        if (caaRes.ok) {
          const caaData = await caaRes.json();
          const frontImg = (caaData.images || []).find(img => img.front) || (caaData.images || [])[0];
          if (frontImg) coverUrl = (frontImg.thumbnails && (frontImg.thumbnails["500"] || frontImg.thumbnails["250"])) || frontImg.image || "";
        }

        return { found: true, artist, title, format, year, genre, coverUrl };
      } catch {
        return { found: false };
      }
    }

    async function saveManualAlbum() {
      const artist = document.getElementById("mArtist").value.trim();
      const title = document.getElementById("mTitle").value.trim();
      const format = document.getElementById("mFormat").value;
      const year = document.getElementById("mYear").value.trim();
      const coverUrl = document.getElementById("mCover").value.trim();

      if (!artist || !title) {
        alert("Completa al menos el Artista y el Título.");
        return;
      }

      const newAlbum = { barcode: scannedBarcodeCache, artist, title, format, year, genre: "", coverUrl };
      const resBox = document.getElementById("scanResult");
      resBox.innerHTML = "💾 Guardando en GitHub...";

      try {
        await saveAlbumToGitHub(newAlbum);
        resBox.className = "result-box added";
        resBox.innerHTML = `<strong>✅ ¡Guardado con éxito!</strong><br>${artist} – <i>${title}</i>`;
        document.getElementById("manualForm").classList.remove("active");
        loadCollection();
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = `❌ Error al guardar. Verifica tu Token de GitHub.`;
      }
    }

    async function saveAlbumToGitHub(newAlbum) {
      const token = getToken();
      if (!token) {
        setupToken();
        throw new Error("Token requerido");
      }

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      
      // 1. Obtener el archivo actual y su SHA
      const getRes = await fetch(apiUrl, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!getRes.ok) throw new Error("Error obteniendo el archivo de GitHub");
      const fileData = await getRes.json();
      
      const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
      currentContent.unshift(newAlbum); // Añadir al principio

      // 2. Codificar y actualizar en GitHub
      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Add album: ${newAlbum.artist} - ${newAlbum.title}`,
          content: updatedContentBase64,
          sha: fileData.sha
        })
      });

      if (!putRes.ok) throw new Error("Error guardando en GitHub");
    }
  </script>
</body>
</html>
