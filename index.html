<!-- Botón flotante actualizado -->
  <button class="fab" onclick="document.getElementById('barcodeInputFile').click()">
    📷 Escanear Código de Barras
  </button>

  <!-- Input oculto nativo para activar la cámara o galería del celular -->
  <input type="file" id="barcodeInputFile" accept="image/*" capture="environment" style="display:none;" onchange="handleBarcodeInput(event)">

  <!-- Modal de Estado / Resultado -->
  <div class="modal-backdrop" id="scannerModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Procesando código...</h3>
        <button class="close-btn" onclick="closeScanner()">✕</button>
      </div>
      <div id="scanResult" class="result-box" style="display:block;">
        🔍 Analizando imagen del código de barras...
      </div>
    </div>
  </div>

  <script>
    // (Mantén tus variables API_URL, allAlbums, activeFormat, loadCollection y renderGrid igual que antes)

    function closeScanner() {
      document.getElementById("scannerModal").classList.remove("open");
    }

    // Procesa la foto tomada por la cámara nativa del celular
    async function handleBarcodeInput(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("modalTitle").innerText = "Leyendo código...";
      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      resBox.innerHTML = "🔍 Analizando la foto del código de barras con la cámara...";
      document.getElementById("scannerModal").classList.add("open");

      try {
        // Usamos la misma librería html5-qrcode para decodificar el código de barras desde el archivo de imagen
        const html5QrCode = new Html5Qrcode("scanResult");
        const decodedText = await html5QrCode.scanFile(file, true);
        
        if (decodedText) {
          submitBarcode(decodedText);
        }
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = "❌ No se pudo detectar un código de barras claro en la foto. Intenta enfocar mejor el código UPC/EAN del disco.";
      } finally {
        // Limpiar el input para permitir reescanear el mismo archivo si fuera necesario
        event.target.value = "";
      }
    }

    async function submitBarcode(code) {
      if (!code || !code.trim()) return;
      const resBox = document.getElementById("scanResult");
      resBox.className = "result-box added";
      resBox.style.display = "block";
      resBox.innerHTML = "🔍 Consultando código <b>" + code + "</b> en MusicBrainz...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "scan", barcode: code })
        });
        const res = await response.json();

        resBox.className = "result-box " + res.status;
        if (res.status === "duplicate") {
          resBox.innerHTML = `<strong>⚠️ ¡Ya lo tienes!</strong><br>${res.album.artist} – <i>${res.album.title}</i> (${res.album.format})`;
        } else if (res.status === "added") {
          resBox.innerHTML = `<strong>✅ ¡Agregado exitosamente!</strong><br>${res.album.artist} – <i>${res.album.title}</i> (${res.album.format})`;
          loadCollection();
        } else {
          resBox.innerHTML = `<strong>❌ No encontrado</strong><br>${res.message}`;
        }
      } catch (err) {
        resBox.className = "result-box error";
        resBox.innerHTML = `<strong>❌ Error de conexión</strong><br>No se pudo comunicar con Google Sheets.`;
      }
    }
  </script>
